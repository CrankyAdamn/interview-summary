<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocktake Form | Hero Sushi Tuggerah</title>
    <style>
        /* Apple-style Font & Reset */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; 
            color: #1d1d1f; 
            margin: 0; 
            padding: 40px 20px; 
            line-height: 1.47059;
        }

        /* Header Container - Right Aligned */
        .header-container { 
            text-align: right; 
            margin-bottom: 60px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .main-title { 
            color: #1d1d1f; 
            font-size: 32px; 
            font-weight: 600; 
            letter-spacing: -0.003em;
            margin: 0; 
        }

        .sub-title { 
            color: #86868b; /* Apple's secondary text color */
            font-size: 14px; 
            margin: 4px 0 0 0; 
            font-weight: 400;
        }

        /* Rest of the table styles remain clean */
        table { width: 100%; max-width: 800px; margin: 0 auto 40px auto; border-collapse: collapse; }
        th { background-color: #f5f5f7; padding: 12px; border-bottom: 1px solid #d2d2d7; text-align: center; font-weight: 500; }
        td { padding: 12px; border-bottom: 1px solid #f5f5f7; text-align: center; }
        .order-col { background-color: #fff9fa; font-weight: bold; }
        
        button { 
            display: block;
            margin: 0 auto;
            padding: 12px 24px; 
            background-color: #0071e3; /* Apple Blue */
            color: white; 
            border: none; 
            border-radius: 980px; /* Pill shape */
            font-size: 17px; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { background-color: #0077ed; }
    </style>
</head>
<body>

<div class="header-container">
    <h1 class="main-title">Stocktake Form | Hero Sushi Tuggerah</h1>
    <p class="sub-title">By Adam</p>
</div>
